name: synthetic-password-recovery-72bytes
on:
  push:
    branches: [test/password-recovery-72bytes-20261112]
    paths:
      - 'sql/pruebas/password_recovery_72bytes_isolated.sql'
      - '.github/workflows/synthetic-password-recovery-72bytes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: synthetic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
      PGDATABASE: synthetic_ci
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated password boundary and replay assertions
        run: psql -X -v ON_ERROR_STOP=1 -f sql/pruebas/password_recovery_72bytes_isolated.sql
