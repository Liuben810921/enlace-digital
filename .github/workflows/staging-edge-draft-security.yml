name: staging-edge-draft-security
on:
  push:
    branches: [audit/f6b21-identity-idempotency-20261110]
    paths:
      - 'supabase/functions/enlace-cliente-auth-staging/**'
      - 'tests/edge_auth_mock_test.ts'
      - '.github/workflows/staging-edge-draft-security.yml'
      - 'docs/st00c-edge-draft-hardening-2026-11-10.md'
      - 'docs/st01-st12-plan-definitivo-ejecucion-controlada-2026-11-10.md'
      - 'docs/st-pre-g1-g5-verificacion-administrativa-2026-11-10.md'
      - 'docs/st-pre-02-protocolo-desbloqueo-g2-g3-g4-2026-11-10.md'
      - 'scripts/check_st_pre_g2_g3_g4_protocol.py'
      - 'scripts/check_st01_st12_definitive_plan.py'
  pull_request:
    paths:
      - 'supabase/functions/enlace-cliente-auth-staging/**'
      - 'tests/edge_auth_mock_test.ts'
      - '.github/workflows/staging-edge-draft-security.yml'
      - 'docs/st01-st12-plan-definitivo-ejecucion-controlada-2026-11-10.md'
      - 'docs/st-pre-g1-g5-verificacion-administrativa-2026-11-10.md'
      - 'docs/st-pre-02-protocolo-desbloqueo-g2-g3-g4-2026-11-10.md'
      - 'scripts/check_st_pre_g2_g3_g4_protocol.py'
      - 'scripts/check_st01_st12_definitive_plan.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-edge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Mocked Edge regression, validation and concurrent isolation (no network)
        run: deno test --no-check --allow-read --allow-write tests/edge_auth_mock_test.ts
      - name: Validate G2-G4 administrative evidence protocol offline
        run: python3 scripts/check_st_pre_g2_g3_g4_protocol.py
      - name: Validate ST-01 to ST-12 definitive plan offline
        run: python3 scripts/check_st01_st12_definitive_plan.py
      - name: Fail-closed static assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("supabase/functions/enlace-cliente-auth-staging/index.ts").read_text()
          assert 'body=parseUniqueJson(' in s
          assert 'if(keys.has(k))throw Error("duplicate key")' in s
          assert 'unverified-proxy' not in s
          assert 'login-ip:' not in s and 'reg-ip:' not in s
          assert 'staging-auth-global' in s and 'login-phone:' in s and 'reg-phone:' in s
          assert 'ED_STAGING_CUSTOMER_AUTH_ENABLED' in s
          assert 'expectedProject="xqahthghvozeigbojhyi"' in s
          print("Offline fail-closed assertions PASS")
          PY
