name: g4-gotrue-mailpit-isolated
on:
  push:
    branches: [audit/f6b21-identity-idempotency-20261110]
    paths:
      - 'tests/g4_gotrue_local/**'
      - '.github/workflows/g4-gotrue-mailpit-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gotrue-local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pull only public images before creating internal-only network
        run: |
          docker pull postgres:17-alpine
          docker pull axllent/mailpit:v1.27
          docker pull supabase/gotrue:v2.177.0
      - name: Start ephemeral services on internal Docker network
        run: docker compose -f tests/g4_gotrue_local/compose.yml up -d --no-build --pull never
      - name: Assert no external default gateway inside GoTrue and Mailpit
        run: |
          set -eu
          for service in auth mailpit; do
            if docker compose -f tests/g4_gotrue_local/compose.yml exec -T "$service" sh -c 'cat /proc/net/route | grep -Eq "^eth[0-9]+[[:space:]]+00000000[[:space:]]"' ; then
              echo "FAIL: external default gateway exists for $service"; exit 1
            fi
          done
          echo "PASS: no default IPv4 gateway in auth and mailpit containers"
      - name: Exercise real local GoTrue email APIs
        run: python3 tests/g4_gotrue_local/check_flows.py
      - name: Capture diagnostic logs on failure
        if: failure()
        run: |
          docker compose -f tests/g4_gotrue_local/compose.yml logs --tail 80 | sed -E 's/(token|password|secret|authorization)([=: ]+)[^ ,]+/\1\2[REDACTED]/Ig'
      - name: Destroy disposable services
        if: always()
        run: docker compose -f tests/g4_gotrue_local/compose.yml down -v --remove-orphans
