name: Verify storefront JavaScript
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/verify-storefront.yml
      - tests/customer-order-flow.cjs
  pull_request:
    paths:
      - index.html
      - .github/workflows/verify-storefront.yml
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax and customer safeguards
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          assert(scripts.length,'Missing inline scripts');
          for(const [i,code] of scripts.entries()){
            try {new vm.Script(code,{filename:'inline-script-'+i+'.js'});}
            catch(e){console.error(e);process.exitCode=1;}
          }
          assert(html.includes('const ED_REAL_CHECKOUT_ENABLED=false;'),'Real checkout must remain disabled');
          assert(html.includes('async function edRestoreCustomerSession()'),'Session restoration must be async');
          const restore=html.split('async function edRestoreCustomerSession(){')[1].split('async function edCustomerLogout()')[0];
          assert(restore.includes("edCustomerRequest('profile',{token:saved.token})"),'Restored session must load profile and recipients');
          assert(restore.includes('edCustomerRecipients=r.destinatarios||[]'),'Restored recipients missing');
          assert(!html.includes('async async function'),'Invalid duplicate async');
          assert(html.includes("edCustomerRequest('register'"),'Missing registration');
          assert(html.includes("edCustomerRequest('login'"),'Missing login');
          assert(html.includes("edCustomerRequest('profile'"),'Missing authenticated profile');
          assert(html.includes("edCustomerRequest('recipient-save'"),'Missing recipient update');
          assert(html.includes('officialStreet') && html.includes('officialAddressFields'),'Missing mandatory signup address');
          assert(html.includes('Elegir o corregir destinatario oficial'),'Missing official recipient checkout entry');
          assert(html.includes('async function edOfficialRecipientCheckout(selectedId=null)'),'Missing async recipient selection');
          assert(html.includes("edCustomerRequest('profile',{token:await edCustomerToken()})"),'Recipient profile refresh missing');
          assert(html.includes('SIMULACIÓN LOCAL: no se realizan cobros'),'Demo checkout isolation lost');
          const preview=html.split('async function edOfficialOrderPreview(){')[1].split('function edOfficialRecipientSelect(){')[0];
          assert(preview.includes('SOLO VISTA PREVIA'),'Official order preview must clearly prohibit submission');
          assert(preview.includes('edCustomerProfile.nombre')&&preview.includes('recipient.direccion')&&preview.includes('x.product.price'),'Order preview must include buyer, address, and priced items');
          assert(preview.includes('validateCart()')&&preview.includes('availability.removed||availability.adjusted'),'Preview must reject stale stock');
          assert(preview.includes('lines.length!==cart.length')&&preview.includes('Number.isFinite(Number(x.product.price))'),'Preview must reject invalid line items and prices');
          assert(preview.includes('await edCustomerToken()')&&preview.includes('!edCustomerProfile'),'Preview must require a non-expired customer session');
          assert(preview.includes('Tienes cambios sin guardar en el destinatario'),'Preview must reject unsaved recipient changes');
          assert(preview.includes("Object.entries(pending).some"),'Preview must compare recipient form with saved record');
          assert(!/edCustomerRequest\(|fetch\(|\.insert\(|\.update\(/.test(preview),'Order preview must not write to a backend');
          assert(html.includes('Ver pedido preparado (sin enviar)'),'Order preview button missing');
          assert(!html.includes('function edCustomerSaveRecipient('),'Obsolete recipient endpoint');
          console.log('Inline JavaScript syntax and customer safeguards verified');
          NODE
      - name: Execute mocked customer order flow tests
        run: node tests/customer-order-flow.cjs
      - name: Verify deployed customer endpoint rejects invalid sessions
        shell: bash
        run: |
          set -euo pipefail
          url="https://ubrvuplslconfxwpfzxj.supabase.co/functions/v1/enlace-cliente-auth"
          status=$(curl --retry 2 --max-time 20 --silent --show-error --output /tmp/customer-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"session","token":"invalid"}' "$url")
          test "$status" = "401" || { echo "Expected 401 for invalid session; got $status"; cat /tmp/customer-response.json; exit 1; }
          echo "Invalid session correctly rejected"
          status=$(curl --retry 2 --max-time 20 --silent --show-error --output /tmp/recipient-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"recipient-save","token":"invalid","recipient":{"name":"Test"}}' "$url")
          test "$status" = "401" || { echo "Expected 401 for unauthenticated recipient write; got $status"; cat /tmp/recipient-response.json; exit 1; }
          echo "Unauthenticated recipient update correctly rejected"
          status=$(curl --retry 2 --max-time 20 --silent --show-error --output /tmp/unknown-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"unsupported-action"}' "$url")
          test "$status" = "400" || { echo "Expected 400 for unknown action; got $status"; cat /tmp/unknown-response.json; exit 1; }
          echo "Unknown action correctly rejected"

  gmail_diagnostic:
    # Runs only on main push; does not send mail or print secrets or raw responses.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check protected Gmail diagnostics without sending messages
        env:
          INTERNAL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$INTERNAL_KEY" ]; then
            echo "Diagnostic not executed: protected credential unavailable in Actions."
            exit 0
          fi
          for action in status smtp-probe; do
            export DIAG_ACTION="$action"
            curl --silent --show-error --max-time 12 --retry 1 \
              --output /tmp/ed-gmail-diagnostic.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $INTERNAL_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"action\":\"$action\"}" \
              "https://ubrvuplslconfxwpfzxj.supabase.co/functions/v1/enlace-correo-staging" > /tmp/ed-gmail-http-status
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          action=os.environ['DIAG_ACTION']
          code=Path('/tmp/ed-gmail-http-status').read_text().strip()
          try: body=json.loads(Path('/tmp/ed-gmail-diagnostic.json').read_text())
          except Exception: body={}
          if code!='200':
              print('Protected diagnostic could not run; HTTP '+code)
              raise SystemExit(1)
          if action=='status':
              print('Gmail app-password presence: '+('confirmed' if body.get('credential_present') is True else 'not confirmed'))
          else:
              print('TLS 465: '+('connected' if body.get('tls_reachable') is True else 'not connected'))
              print('No email sent: '+('confirmed' if body.get('email_sent') is False else 'not confirmed'))
          PY
          done
