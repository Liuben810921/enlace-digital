name: Verify storefront JavaScript
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/verify-storefront.yml
  pull_request:
    paths:
      - index.html
      - .github/workflows/verify-storefront.yml
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax and customer safeguards
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          assert(scripts.length,'Missing inline scripts');
          for(const [i,code] of scripts.entries()){
            try {new vm.Script(code,{filename:'inline-script-'+i+'.js'});}
            catch(e){console.error(e);process.exitCode=1;}
          }
          assert(html.includes('const ED_REAL_CHECKOUT_ENABLED=false;'),'Real checkout must remain disabled');
          assert(html.includes('async function edRestoreCustomerSession()'),'Session restoration must be async');
          assert(!html.includes('async async function'),'Invalid duplicate async');
          assert(html.includes("edCustomerRequest('register'"),'Missing registration');
          assert(html.includes("edCustomerRequest('login'"),'Missing login');
          assert(html.includes("edCustomerRequest('profile'"),'Missing authenticated profile');
          assert(html.includes("edCustomerRequest('recipient-save'"),'Missing recipient update');
          assert(html.includes('officialRecipientAddress'),'Missing mandatory signup address');
          assert(html.includes('Elegir o corregir destinatario oficial'),'Missing official recipient checkout entry');
          assert(html.includes('async function edOfficialRecipientCheckout(selectedId=null)'),'Missing async recipient selection');
          assert(html.includes("edCustomerRequest('profile',{token:await edCustomerToken()})"),'Recipient profile refresh missing');
          assert(html.includes('SIMULACIÓN LOCAL: no se realizan cobros'),'Demo checkout isolation lost');
          assert(!html.includes('function edCustomerSaveRecipient('),'Obsolete recipient endpoint');
          console.log('Inline JavaScript syntax and customer safeguards verified');
          NODE
      - name: Verify deployed customer endpoint rejects invalid sessions
        shell: bash
        run: |
          set -euo pipefail
          url="https://ubrvuplslconfxwpfzxj.supabase.co/functions/v1/enlace-cliente-auth"
          status=$(curl --retry 2 --max-time 20 --silent --show-error --output /tmp/customer-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"session","token":"invalid"}' "$url")
          test "$status" = "401" || { echo "Expected 401 for invalid session; got $status"; cat /tmp/customer-response.json; exit 1; }
          echo "Invalid session correctly rejected"
          status=$(curl --retry 2 --max-time 20 --silent --show-error --output /tmp/recipient-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"recipient-save","token":"invalid","recipient":{"name":"Test"}}' "$url")
          test "$status" = "401" || { echo "Expected 401 for unauthenticated recipient write; got $status"; cat /tmp/recipient-response.json; exit 1; }
          echo "Unauthenticated recipient update correctly rejected"
          status=$(curl --retry 2 --max-time 20 --silent --show-error --output /tmp/unknown-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"unsupported-action"}' "$url")
          test "$status" = "400" || { echo "Expected 400 for unknown action; got $status"; cat /tmp/unknown-response.json; exit 1; }
          echo "Unknown action correctly rejected"
