      - 'scripts/check_staging_f6b20_operation_scope.py'
      - 'docs/f6b20-idempotencia-operacion-postgresql-aislado-2026-11-10.md'
      - 'scripts/check_staging_f6b19_recovery_scope.py'
      - 'docs/f6b19-recuperacion-reintentos-idempotencia-postgresql-aislado-2026-11-10.md'
      - 'scripts/check_staging_f6b18_prospective_concurrency.py'
      - 'docs/f6b18-concurrencia-deduplicacion-prospectiva-postgresql-aislado-2026-11-10.md'
      - 'scripts/check_staging_f6b15_adversarial_security.py'
      - 'docs/f6b15-pruebas-adversariales-encapsulacion-postgresql-aislado-2026-11-10.md'
      - 'docs/f6b14-norm-v1-vectores-seguridad-postgresql-aislado-2026-11-10.md'
      - 'tests/fixtures/norm_v1_utf8_vectors.json'
      - '.github/workflows/f6b13-isolated-postgres-security.yml'
  pull_request:
    branches: [main, audit/registro-staging-aislado-20261109]
    paths:
      - 'sql/pruebas/f6b13_encapsulated_synthetic_isolated.sql'
      - 'docs/f6b13-prototipo-postgresql-encapsulado-aislado-2026-11-10.md'
      - 'scripts/check_staging_f6b13_isolated_security.py'
      - 'scripts/generate_f6b14_synthetic_sql.py'
      - 'scripts/generate_f6b15_adversarial_sql.py'
      - 'sql/pruebas/f6b18_prospective_isolated_setup.sql'
      - 'scripts/run_f6b18_concurrency_isolated.py'
      - 'scripts/run_f6b19_recovery_isolated.py'
      - 'sql/pruebas/f6b20_operation_idempotency_isolated.sql'
      - 'sql/pruebas/f6b21_identity_operation_isolated.sql'
      - 'sql/pruebas/f6b23_portable_contract_isolated.sql'
      - 'scripts/run_f6b23_portable_contract_isolated.py'
      - 'scripts/run_f6b24_raw_json_contract_isolated.py'
      - 'scripts/run_f6b25_adversarial_contract_isolated.py'
      - 'scripts/run_f6b26_crash_retries_isolated.py'
      - 'docs/f6b26-crash-retry-isolation-2026-11-10.md'
      - 'docs/f6b25-adversarial-contract-2026-11-10.md'
      - 'docs/f6b24-raw-json-contract-2026-11-10.md'
      - 'docs/f6b23-portable-canonical-contract-2026-11-10.md'
      - 'scripts/run_f6b21_identity_operation_isolated.py'
      - 'docs/f6b21-identity-idempotency-isolated-2026-11-10.md'
      - 'scripts/run_f6b20_operation_idempotency_isolated.py'
      - 'scripts/check_staging_f6b20_operation_scope.py'
      - 'docs/f6b20-idempotencia-operacion-postgresql-aislado-2026-11-10.md'
      - 'scripts/check_staging_f6b19_recovery_scope.py'
      - 'docs/f6b19-recuperacion-reintentos-idempotencia-postgresql-aislado-2026-11-10.md'
      - 'scripts/check_staging_f6b18_prospective_concurrency.py'
      - 'docs/f6b18-concurrencia-deduplicacion-prospectiva-postgresql-aislado-2026-11-10.md'
      - 'scripts/check_staging_f6b15_adversarial_security.py'
      - 'docs/f6b15-pruebas-adversariales-encapsulacion-postgresql-aislado-2026-11-10.md'
      - 'docs/f6b14-norm-v1-vectores-seguridad-postgresql-aislado-2026-11-10.md'
      - 'tests/fixtures/norm_v1_utf8_vectors.json'
      - '.github/workflows/f6b13-isolated-postgres-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: synthetic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Static fail-closed staging isolation checks
        run: python3 scripts/check_staging_f6b13_isolated_security.py
      - name: Install isolated PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Run synthetic PostgreSQL transaction and rollback
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: psql -X -v ON_ERROR_STOP=1 -f sql/pruebas/f6b13_encapsulated_synthetic_isolated.sql
      - name: Generate F6-B14 30-vector synthetic SQL (no database access)
        run: python3 scripts/generate_f6b14_synthetic_sql.py
      - name: Execute F6-B14 28 transportable vectors and negative security tests in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: psql -X -v ON_ERROR_STOP=1 -f /tmp/f6b14_synthetic_generated.sql
      - name: Static F6-B15 adversarial boundary checks
        run: python3 scripts/check_staging_f6b15_adversarial_security.py
      - name: Generate F6-B15 synthetic adversarial extension
        run: python3 scripts/generate_f6b15_adversarial_sql.py
      - name: Execute F6-B15 isolated PostgreSQL adversarial tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: psql -X -v ON_ERROR_STOP=1 -f /tmp/f6b15_adversarial_generated.sql
      - name: Static F6-B18 isolation and concurrency guards
        run: python3 scripts/check_staging_f6b18_prospective_concurrency.py
      - name: Setup F6-B18 disposable prospective schema and restricted roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: psql -X -v ON_ERROR_STOP=1 -f sql/pruebas/f6b18_prospective_isolated_setup.sql
      - name: Run F6-B18 two-session synthetic concurrency and negative permissions
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: python3 scripts/run_f6b18_concurrency_isolated.py
      - name: Static F6-B19 recovery isolation guards
        run: python3 scripts/check_staging_f6b19_recovery_scope.py
      - name: Run F6-B19 synthetic crash recovery and retry consistency
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'TRUNCATE f6b18_synthetic.prospective_keys RESTART IDENTITY;'
          python3 scripts/run_f6b19_recovery_isolated.py
      - name: Static F6-B20 operation isolation gates
        run: python3 scripts/check_staging_f6b20_operation_scope.py
      - name: Setup F6-B20 disposable operation-idempotency fixture
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: psql -X -v ON_ERROR_STOP=1 -f sql/pruebas/f6b20_operation_idempotency_isolated.sql
      - name: Run F6-B20 two-session synthetic operation idempotency
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: python3 scripts/run_f6b20_operation_idempotency_isolated.py

      - name: Setup F6-B21 isolated identity and server-side hash fixture
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: psql -X -v ON_ERROR_STOP=1 -f sql/pruebas/f6b21_identity_operation_isolated.sql
      - name: Run F6-B21 synthetic identity, canonicalization, concurrency, ACL and RLS
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: python3 scripts/run_f6b21_identity_operation_isolated.py

      - name: Setup F6-B23 disposable portable contract
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: psql -X -v ON_ERROR_STOP=1 -f sql/pruebas/f6b23_portable_contract_isolated.sql
      - name: Run F6-B23 independent digest and adversarial validation
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: python3 scripts/run_f6b23_portable_contract_isolated.py

      - name: Run F6-B24 raw JSON lexical and parser divergence tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: python3 scripts/run_f6b24_raw_json_contract_isolated.py

      - name: Run F6-B25 adversarial raw parser and concurrent retry isolation
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: python3 scripts/run_f6b25_adversarial_contract_isolated.py

      - name: Run F6-B26 synthetic connection-loss, retries and least privilege
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic_ci_only
          PGDATABASE: synthetic_ci
        run: python3 scripts/run_f6b26_crash_retries_isolated.py
