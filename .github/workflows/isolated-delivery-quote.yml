name: isolated-delivery-quote
on:
  push:
    branches: [audit/delivery-map-readonly-20261113]
    paths:
      - 'tests/delivery-quote-isolated.cjs'
      - 'tests/delivery-quote-isolated.test.cjs'
      - 'tests/delivery-origins-ui.test.cjs'
      - 'tests/delivery-dispatch-isolated.cjs'
      - 'tests/delivery-dispatch-isolated.test.cjs'
      - 'tests/delivery-route-adapter-isolated.cjs'
      - 'tests/delivery-route-adapter-isolated.test.cjs'
      - 'tests/delivery-route-cache-isolated.cjs'
      - 'tests/delivery-route-cache-isolated.test.cjs'
      - 'tests/delivery-route-validation-isolated.cjs'
      - 'tests/delivery-route-validation-isolated.test.cjs'
      - 'tests/delivery-route-lab-ui.test.cjs'
      - 'tests/delivery-integration-contracts.test.cjs'
      - 'tests/delivery-mixed-fees-isolated.cjs'
      - 'tests/delivery-mixed-fees-isolated.test.cjs'
      - 'tests/delivery-promotion-config-isolated.cjs'
      - 'tests/delivery-promotion-config-isolated.test.cjs'
      - 'tests/delivery-promotion-admin-preview-isolated.cjs'
      - 'tests/delivery-promotion-admin-preview-isolated.test.cjs'
      - 'tests/delivery-accounting-manager-isolated.cjs'
      - 'tests/delivery-accounting-manager-isolated.test.cjs'
      - 'tests/fixtures/delivery-admin-mobile-demo.html'
      - 'tests/delivery-admin-mobile-demo.test.cjs'
      - 'tests/delivery-manager-customer-preview-isolated.cjs'
      - 'tests/delivery-manager-customer-preview-isolated.test.cjs'
      - 'tests/fixtures/delivery-manager-mobile-demo.html'
      - 'tests/delivery-manager-mobile-demo.test.cjs'
      - 'tests/fixtures/delivery-quote-shared-core.js'
      - 'tests/delivery-shared-quote-parity.test.cjs'
      - 'tests/delivery-manager-server-contract-isolated.cjs'
      - 'tests/delivery-manager-server-contract-isolated.test.cjs'
      - 'tests/delivery-manager-server-adversarial-isolated.test.cjs'
      - 'tests/delivery-manager-policy-route-audit-isolated.cjs'
      - 'tests/delivery-manager-policy-route-audit-isolated.test.cjs'
      - 'tests/delivery-manager-integrated-boundary-isolated.cjs'
      - 'tests/delivery-manager-integrated-boundary-isolated.test.cjs'
      - 'tests/delivery-manager-concurrency-idempotency-isolated.cjs'
      - 'tests/delivery-manager-concurrency-idempotency-isolated.test.cjs'
      - 'tests/postgres-delivery-quote-lab.sql'
      - 'tests/postgres-delivery-quote-lab.sh'
      - 'tests/postgres-delivery-resilience-lab.py'
      - 'tests/postgres-delivery-recovery-lab.py'
      - 'tests/postgres-delivery-rpc-rls-lab.sql'
      - 'tests/postgres-delivery-rpc-rls-lab.py'
      - 'tests/delivery-backend-spec-offline.test.cjs'
      - 'docs/audits/delivery-manager-backend-contract-spec-2026-11-13.md'
      - 'index.html'
      - '.github/workflows/isolated-delivery-quote.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: node tests/delivery-quote-isolated.test.cjs
      - run: node tests/delivery-origins-ui.test.cjs
      - run: node tests/delivery-dispatch-isolated.test.cjs
      - run: node tests/delivery-route-adapter-isolated.test.cjs
      - run: node tests/delivery-route-cache-isolated.test.cjs
      - run: node tests/delivery-route-validation-isolated.test.cjs
      - run: node tests/delivery-route-lab-ui.test.cjs
      - run: node tests/delivery-integration-contracts.test.cjs
      - run: node tests/delivery-mixed-fees-isolated.test.cjs
      - run: node tests/delivery-promotion-config-isolated.test.cjs
      - run: node tests/delivery-promotion-admin-preview-isolated.test.cjs
      - run: node tests/delivery-accounting-manager-isolated.test.cjs
      - run: node tests/delivery-admin-mobile-demo.test.cjs
      - run: node tests/delivery-manager-customer-preview-isolated.test.cjs
      - run: node tests/delivery-manager-mobile-demo.test.cjs
      - run: node tests/delivery-shared-quote-parity.test.cjs
      - run: node tests/delivery-manager-server-contract-isolated.test.cjs
      - run: node tests/delivery-manager-server-adversarial-isolated.test.cjs
      - run: node tests/delivery-manager-policy-route-audit-isolated.test.cjs
      - run: node tests/delivery-manager-integrated-boundary-isolated.test.cjs
      - run: node tests/delivery-manager-concurrency-idempotency-isolated.test.cjs
      - run: node tests/delivery-backend-spec-offline.test.cjs
      - name: PostgreSQL disposable concurrency and idempotency lab
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          bash tests/postgres-delivery-quote-lab.sh
      - name: PostgreSQL resilience - deadlocks, backoff, routing races and disconnects
        run: |
          python3 -m pip install --quiet --break-system-packages 'psycopg[binary]>=3.2,<4'
          python3 tests/postgres-delivery-resilience-lab.py
      - name: PostgreSQL recovery - cancellation, timeouts and deadlock retries
        run: python3 tests/postgres-delivery-recovery-lab.py
      - name: PostgreSQL RPC permissions and RLS synthetic laboratory
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f tests/postgres-delivery-rpc-rls-lab.sql
          python3 tests/postgres-delivery-rpc-rls-lab.py
