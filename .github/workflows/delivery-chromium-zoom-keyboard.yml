name: Isolated delivery Chromium accessibility and zoom
on:
  push:
    branches:
      - plan/maestro-finalizacion-seguridad-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-accessibility:
    # Playwright 1.56.1 cannot install Chromium dependencies on ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and quarantine logic without browser
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-evidence
          node --check tests/delivery-chromium-zoom-keyboard-isolated.cjs
          node tests/delivery-mobile-quarantine-accessibility.test.cjs 2>&1 | tee ci-evidence/quarantine-accessibility-node.log
          node tests/delivery-mobile-quarantine-visibility.test.cjs 2>&1 | tee ci-evidence/quarantine-recovery-node.log
      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ed-playwright" "$GITHUB_WORKSPACE/ci-evidence"
          node --version | tee "$GITHUB_WORKSPACE/ci-evidence/node-version.txt"
          npm --version | tee "$GITHUB_WORKSPACE/ci-evidence/npm-version.txt"
          cd "$RUNNER_TEMP/ed-playwright"
          npm init -y
          npm install --no-audit --no-fund --save-exact playwright@1.56.1 2>&1 | tee "$GITHUB_WORKSPACE/ci-evidence/npm-install.log"
          ./node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee "$GITHUB_WORKSPACE/ci-evidence/chromium-install.log"
          echo "NODE_PATH=$RUNNER_TEMP/ed-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Run actual extracted delivery module in Chromium
        run: node tests/delivery-chromium-zoom-keyboard-isolated.cjs
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-chromium-zoom-keyboard
          path: |
            chromium-*-quarantine.png
            ci-evidence/*
          if-no-files-found: ignore
