name: Isolated delivery Chromium accessibility and zoom
on:
  push:
    branches:
      - plan/maestro-finalizacion-seguridad-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual extracted delivery module in Chromium
        run: node tests/delivery-chromium-zoom-keyboard-isolated.cjs
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-chromium-zoom-keyboard
          path: chromium-*-quarantine.png
          if-no-files-found: ignore
