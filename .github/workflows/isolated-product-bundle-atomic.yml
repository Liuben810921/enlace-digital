name: Isolated PostgreSQL product bundle atomicity
on:
  push:
    branches: [plan/maestro-finalizacion-seguridad-20261113]
    paths:
      - 'tests/postgres-product-bundle-atomic-lab.sql'
      - 'tests/postgres-product-bundle-atomic-lab.py'
      - 'tests/postgres-product-bundle-adversarial-lab.py'
      - 'tests/postgres-product-bundle-tenant-lab.sql'
      - 'tests/postgres-product-bundle-tenant-recovery-lab.py'
      - 'tests/postgres-product-bundle-integrated-lab.sql'
      - 'tests/postgres-product-bundle-integrated-lab.py'
      - 'tests/postgres-product-bundle-integrated-adversarial.py'
      - 'tests/postgres-product-bundle-integrated-advanced.py'
      - 'tests/postgres-product-bundle-integrated-deadlocks.py'
      - '.github/workflows/isolated-product-bundle-atomic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-bundle-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PostgreSQL client and psycopg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python3 -m pip install --quiet --break-system-packages 'psycopg[binary]>=3.2,<4'
      - name: Execute isolated schema and transactional concurrency assertions
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f tests/postgres-product-bundle-atomic-lab.sql
          python3 tests/postgres-product-bundle-atomic-lab.py 2>&1 | tee product-bundle-atomic-results.log
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c 'DROP SCHEMA ed_bundle_lab CASCADE; DROP ROLE ed_bundle_client; DROP ROLE ed_bundle_owner;'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f tests/postgres-product-bundle-atomic-lab.sql
          python3 tests/postgres-product-bundle-adversarial-lab.py 2>&1 | tee -a product-bundle-atomic-results.log
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f tests/postgres-product-bundle-tenant-lab.sql
          python3 tests/postgres-product-bundle-tenant-recovery-lab.py 2>&1 | tee -a product-bundle-atomic-results.log
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f tests/postgres-product-bundle-integrated-lab.sql
          python3 tests/postgres-product-bundle-integrated-lab.py 2>&1 | tee -a product-bundle-atomic-results.log
          python3 tests/postgres-product-bundle-integrated-adversarial.py 2>&1 | tee -a product-bundle-atomic-results.log
          python3 tests/postgres-product-bundle-integrated-advanced.py 2>&1 | tee -a product-bundle-atomic-results.log
          python3 tests/postgres-product-bundle-integrated-deadlocks.py 2>&1 | tee -a product-bundle-atomic-results.log
      - name: Upload non-sensitive synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-product-bundle-atomic
          path: product-bundle-atomic-results.log
          if-no-files-found: ignore
