name: staging-auth-static-check
on:
  push:
    branches: [audit/registro-staging-aislado-20261109]
    paths:
      - 'supabase/functions/enlace-cliente-auth-staging/**'
      - 'sql/propuestas/**'
      - 'sql/pruebas/staging_registro_sesiones_rollback_ejecutable_tras_aprobacion.sql'
      - '.github/workflows/staging-auth-static-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/enlace-cliente-auth-staging/**'
      - 'sql/propuestas/**'
      - 'sql/pruebas/staging_registro_sesiones_rollback_ejecutable_tras_aprobacion.sql'
      - '.github/workflows/staging-auth-static-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: TypeScript typecheck (no execution of function)
        run: deno check supabase/functions/enlace-cliente-auth-staging/index.ts
      - name: Security invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("supabase/functions/enlace-cliente-auth-staging/index.ts").read_text()
          q=Path("sql/propuestas/staging_rpc_canonico_v3_no_ejecutar.sql").read_text()
          assert 'ubrvuplslconfxwpfzxj' not in s
          assert 'ED_STAGING_CUSTOMER_AUTH_ENABLED' in s
          assert 'expectedProject="xqahthghvozeigbojhyi"' in s
          assert 'if(!enabled||!validProject)' in s
          assert 'SECURITY DEFINER SET search_path TO' in q
          assert 'FROM PUBLIC,anon,authenticated' in q
          assert 'TO service_role' in q
          assert "'numero',c.cliente_numero" in q
          assert "'cerrada',true" in q
          assert "WHERE numero=(c->>'numero')::integer" in q
          assert 'length(coalesce(p_direccion' in q
          assert 'DO NOT EXECUTE' in q
          schema=Path("sql/propuestas/staging_esquema_canonico_v3_no_ejecutar.sql").read_text()
          tests=Path("sql/pruebas/staging_registro_sesiones_rollback_ejecutable_tras_aprobacion.sql").read_text()
          assert q.count("CREATE OR REPLACE FUNCTION")==5, "RPC duplicadas"
          assert q.count("COMMIT;")==1 and schema.count("COMMIT;")==1, "Migracion duplicada"
          assert q.count("BEGIN;")==6 and schema.count("BEGIN;")==1, "Bloques inesperados"
          assert "IF p_telefono !~ '^[+][1-9][0-9]{7,14}
          assert "punto_salida_id text" in schema
          assert tests.count("n:=n+1;")==17
          assert "BEGIN;" in tests and "ROLLBACK;" in tests
          assert "ed_cliente_sesion_privada" in tests
          assert "ed_cliente_registrar_residencia_privado" in tests
          print("Static guards PASS")
          PY
" in q
          assert "correo !~ '^[^ @]+@[^ @]+[.][^ @]+
          assert "punto_salida_id text" in schema
          assert tests.count("n:=n+1;")==17
          assert "BEGIN;" in tests and "ROLLBACK;" in tests
          assert "ed_cliente_sesion_privada" in tests
          assert "ed_cliente_registrar_residencia_privado" in tests
          print("Static guards PASS")
          PY
" in q
          assert "telefono ~ '^([+]53)?[0-9]{8}
          assert "punto_salida_id text" in schema
          assert tests.count("n:=n+1;")==17
          assert "BEGIN;" in tests and "ROLLBACK;" in tests
          assert "ed_cliente_sesion_privada" in tests
          assert "ed_cliente_registrar_residencia_privado" in tests
          print("Static guards PASS")
          PY
" in schema
          assert "CREATE SEQUENCE IF NOT EXISTS public.clientes_oficiales_numero_seq" in schema
          assert "punto_salida_id text" in schema
          assert tests.count("n:=n+1;")==17
          assert "BEGIN;" in tests and "ROLLBACK;" in tests
          assert "ed_cliente_sesion_privada" in tests
          assert "ed_cliente_registrar_residencia_privado" in tests
          print("Static guards PASS")
          PY
