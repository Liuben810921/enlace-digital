  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: TypeScript typecheck (no execution of function)
        run: deno check supabase/functions/enlace-cliente-auth-staging/index.ts
      - name: Offline Edge handler mock tests (no network or database)
        run: deno test --no-check --allow-read --allow-write tests/edge_auth_mock_test.ts
      - name: Offline browser transport tests (no network or database)
        run: node --test tests/staging_customer_web_adapter_test.mjs
      - name: Static recipient and delivery isolation checks (no database connection)
        run: python3 scripts/check_staging_isolation.py
      - name: Static historical order design checks (no database connection)
        run: python3 scripts/check_orders_design_contract.py
      - name: Static orders API contract checks (no database connection)
        run: python3 scripts/check_orders_api_contract.py
      - name: Static orders transaction and concurrency checks (no database connection)
        run: python3 scripts/check_orders_transactions_contract.py
      - name: Static orders transaction design checks (no database connection)
        run: python3 scripts/check_orders_transaction_design.py
      - name: Static variant stock and cancellation contracts (no database connection)
        run: python3 scripts/check_orders_variant_stock_contract.py
      - name: Static unified inventory and reservation design checks
        run: python3 scripts/check_unified_inventory_reservations.py
      - name: Static inventory staging migration proposal (no database)
        run: python3 scripts/check_inventory_migration_proposal.py
      - name: Static staging inventory schema audit documentation
        run: python3 scripts/check_staging_inventory_schema_audit.py
      - name: Static minimal catalog and official orders schema contract
        run: python3 scripts/check_staging_catalog_orders_minimal_schema.py
      - name: Static full catalog serialization and staging schema contract
        run: python3 scripts/check_full_catalog_staging_contract.py
      - name: Static canonical master implementation plan (no database)
        run: python3 scripts/check_master_catalog_orders_inventory_plan.py
      - name: Static staging migration manifest and gates (no database)
        run: python3 scripts/check_staging_migration_manifest.py
      - name: Static staging preflight matrix (no database)
        run: python3 scripts/check_staging_preflight_matrix.py
      - name: Static P01-P08 staging metadata results (no database)
        run: python3 scripts/check_staging_preflight_p01_p08_results.py
      - name: Static auth function metadata audit (no database)
        run: python3 scripts/check_staging_auth_function_metadata_audit.py
      - name: Static RPC controller and metadata reconciliation (offline)
        run: python3 scripts/check_staging_rpc_controller_reconciliation.py
      - name: Static staging auth route dependencies (offline)
        run: python3 scripts/check_staging_auth_route_dependencies.py
      - name: Static staging remediation decisions (offline)
        run: python3 scripts/check_staging_remediation_v4_race_bigint.py
      - name: Static incremental migration and bigint spec (offline)
        run: python3 scripts/check_staging_incremental_dedup_bigint_spec.py
      - name: Static GitHub Actions diagnostics (offline)
        run: python3 scripts/check_github_actions_diagnostic.py
      - name: Static F0 staging metadata audit results (offline)
        run: python3 scripts/check_staging_f0_metadata_results.py
      - name: Offline F1 normalization and bigint contract checks
        run: python3 scripts/check_staging_f1_contracts.py
      - name: Offline F2 incremental migration plan checks
        run: python3 scripts/check_staging_f2_migration_plan.py
      - name: Offline F2 incremental migration plan checks
        run: python3 scripts/check_staging_f2_migration_plan.py
      - name: Offline F3 atomic delivery RPC design checks
        run: python3 scripts/check_staging_f3_atomic_rpc_plan.py
      - name: Offline F4 bigint-safe adapter contract checks
        run: python3 scripts/check_staging_f4_bigint_adapters_plan.py
      - name: Offline F5 synthetic concurrency migration and bigint simulations
        run: python3 scripts/check_staging_f5_offline_simulations.py
      - name: Install PostgreSQL parser (no database connection)
        run: python3 -m pip install --disable-pip-version-check 'pglast==7.22'
      - name: PostgreSQL syntax parse (no database connection)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files=[
            "sql/propuestas/staging_rpc_unico_v4_no_ejecutar.sql",
            "sql/propuestas/staging_esquema_unico_v4_no_ejecutar.sql",
            "sql/pruebas/staging_registro_sesiones_rollback_ejecutable_tras_aprobacion.sql"
          ]
          for file in files:
              statements=parse_sql(Path(file).read_text())
              print(f"PostgreSQL parse PASS: {file} ({len(statements)} statements)")
          PY
      - name: Static SQL contract checks (no database connection)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backend=Path("supabase/functions/enlace-cliente-auth-staging/index.ts").read_text()
          config=Path("supabase/config.toml").read_text()
          assert "[functions.enlace-cliente-auth-staging]" in config and "verify_jwt = false" in config
          assert "https://liuben810921.github.io" in backend
          assert 'req.headers.get("apikey")' in backend
          assert 'SUPABASE_PUBLISHABLE_KEYS' in backend
          assert 'ED_STAGING_PUBLISHABLE_KEY' not in backend
          rpc=Path("sql/propuestas/staging_rpc_unico_v4_no_ejecutar.sql").read_text()
          schema=Path("sql/propuestas/staging_esquema_unico_v4_no_ejecutar.sql").read_text()
          tests=Path("sql/pruebas/staging_registro_sesiones_rollback_ejecutable_tras_aprobacion.sql").read_text()
          assert "ubrvuplslconfxwpfzxj" not in backend
          assert "ED_STAGING_CUSTOMER_AUTH_ENABLED" in backend
          assert 'expectedProject="xqahthghvozeigbojhyi"' in backend
          assert "if(!enabled||!validProject||!key||!allowedOrigin||!publishableKey.startsWith" in backend
          assert rpc.count("CREATE OR REPLACE FUNCTION")==5
          assert rpc.count("COMMIT;")==1 and schema.count("COMMIT;")==1
          assert rpc.count("BEGIN;")==1 and schema.count("BEGIN;")==1
          assert rpc.count("END; $fn$;")==5
          assert "p_telefono !~ (" in rpc and "correo !~ (" in rpc
          assert "telefono ~ (" in schema
          assert "SECURITY DEFINER SET search_path TO" in rpc
          assert "FROM PUBLIC,anon,authenticated" in rpc
          assert "TO service_role" in rpc
          assert "CREATE SEQUENCE IF NOT EXISTS public.clientes_oficiales_numero_seq" in schema
          assert "punto_salida_id text" in schema
          assert tests.count("n:=n+1;")==17
          assert "BEGIN;" in tests and "ROLLBACK;" in tests
          # Verify explicit RPC contracts, isolation and staging-only safety.
          expected={
            "ed_cliente_registrar_privado":4,
            "ed_cliente_registrar_residencia_privado":9,
            "ed_cliente_login_privado":3,
            "ed_cliente_sesion_privada":2,
            "ed_cliente_direccion_privada":5,
          }
          import re
          definitions=re.findall(r"CREATE OR REPLACE FUNCTION public\.(ed_cliente_\w+)\((.*?)\) RETURNS",rpc,re.S)
          assert len(definitions)==5, "Five function signatures required"
          for name,arguments in definitions:
              assert name in expected, f"Unexpected RPC {name}"
              assert len(re.findall(r"\bp_\w+\s+(?:text|boolean)\b",arguments))==expected[name], f"Signature mismatch {name}"
          assert len(re.findall(r"SECURITY DEFINER SET search_path TO ''",rpc))==5
          assert "REVOKE ALL ON FUNCTION" in rpc and "FROM PUBLIC,anon,authenticated" in rpc
          assert "GRANT EXECUTE ON FUNCTION" in rpc and "TO service_role" in rpc
          for action in ('register','login','address-save','recipient-save','delivery-location-save','session','logout','profile'):
              assert f'action==="{action}"' in backend, f"Missing route {action}"
          for name in ("ed_cliente_registrar_residencia_privado","ed_cliente_login_privado","ed_cliente_sesion_privada","ed_cliente_direccion_privada","ed_cliente_limite_privado"):
              assert f'db.rpc("{name}"' in backend, f"Missing Edge RPC {name}"
          assert "p_residencia='cuba'" in rpc and "Direccion habitual requerida" in rpc
          assert "p_residencia NOT IN ('cuba','extranjero')" in rpc
          assert '.eq("cliente_numero",customer.numero)' in backend
          assert "cliente_numero:customer.numero" in backend
          assert "revocada_en=now()" in rpc and "expira_en>now()" in rpc
          assert rpc.count("CREATE OR REPLACE FUNCTION public.ed_cliente_")==5, "Duplicated or missing RPC definitions"
          assert rpc.count("END; $fn$;")==5, "Truncated or duplicated PL/pgSQL bodies"
          assert rpc.count("\nCOMMIT;")==1, "Duplicated SQL transaction"
          assert rpc.rstrip().endswith("COMMIT;"), "Unexpected trailing SQL"
          assert rpc.count("AS $fn$")==5, "Missing PL/pgSQL body delimiter"
          assert rpc.count("IF p_token_hash IS NULL OR p_token_hash !~")==2, "Missing explicit NULL token checks"
          assert "IF p_token_hash IS NULL OR p_token_hash !~ '^[a-f0-9]{64}$' THEN RAISE EXCEPTION 'Token invalido'; END IF;" in rpc
          assert "IF p_token_hash IS NULL OR p_token_hash !~ '^[a-f0-9]{64}$' THEN RETURN NULL; END IF;" in rpc
          assert "FAIL cruce de clientes" in tests and "FAIL replay revocado" in tests
          assert "FAIL expiracion" in tests and "FAIL permisos RPC" in tests
          assert "ed_cliente_limite_privado" in Path("docs/auditoria-contratos-rpc-staging-2026-11-09.md").read_text()
          print("RPC contracts and staging safety PASS")
          print("Static guards PASS")
          PY
